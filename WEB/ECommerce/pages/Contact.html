<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Form </title>
        <link rel="stylesheet" href="../Styles/contact.css">
    </head>
    <body>
        <form action="">
            <fieldset>
                <legend>ThinkMart</legend>
                <h1>
                    Contact Us
                </h1>
                <label for="username">Username: </label>
                <input type="text" minlength="3" maxlength="10" required id="username" placeholder="Enter Username">

                <br><br>
                <label for="email">Email: </label>
                <input type="email" required id="email" placeholder="Enter Email">

                <br><br>
                <label for="message">Message: </label>
                <textarea id="message" required placeholder="Enter your message"></textarea>

                <br><br>
                <button type="submit">Submit </button>
                <button type="reset">Cancel</button>
            </fieldset>
        </form>
    </body>
</html>
