<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register Form </title>
        <link rel="stylesheet" href="../styles/register.css">
    </head>
    <body>
        <form action="">
            <fieldset>
                <legend>ThinkMart</legend>
                <h1>
                    Create Account
                </h1>
                <label for="username">Username: </label>
                <input type="text" minlength="3" maxlength="10" required id="username" placeholder="Enter Username">

                <br><br>
                <label for="email">Email: </label>
                <input type="email" required id="email" placeholder="Enter Email">

                <br><br>
                <label for="password">Password: </label>
                <input type="password" required minlength="6" maxlength="8" id="password" placeholder="Enter Password"> <span>👁️</span>

                <br><br>
                <button type="submit">Register </button>
                <button type="reset">Cancel</button>
                <br><br>
                <p>Already have an account? <a href="../pages/login.html">Login here
            </fieldset>
        </form>
    </body>
</html>
